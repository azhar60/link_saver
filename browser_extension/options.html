<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Link Saver — Options</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0a0d14;
      color: #e5e7ef;
      min-width: 360px;
    }
    body {
      padding: 20px 22px;
      background:
        radial-gradient(closest-side, rgba(6,182,212,0.10) 0%, transparent 60%) top right / 70% 70% no-repeat,
        radial-gradient(closest-side, rgba(139,92,246,0.10) 0%, transparent 60%) bottom left / 70% 70% no-repeat,
        #0a0d14;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, #67e8f9 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.subtle { margin: 0 0 16px; color: #9aa3b5; font-size: 12px; }
    label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #9aa3b5; margin-bottom: 6px; }
    input[type="url"] {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      color: #f1f3f8;
      font-size: 13px;
    }
    input[type="url"]:focus {
      outline: none;
      border-color: rgba(34, 211, 238, 0.55);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
    }
    button {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      color: #fff;
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 8px 24px -8px rgba(139, 92, 246, 0.5);
    }
    button:hover { filter: brightness(1.08); }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: #6ee7a7;
      opacity: 0;
      transition: opacity 200ms;
    }
    .status.show { opacity: 1; }
    .hint { color: #7a839a; font-size: 11px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Link Saver</h1>
  <p class="subtle">Where should saves go?</p>

  <label for="base-url">App URL</label>
  <input id="base-url" type="url" placeholder="https://links.your-domain.com" required>
  <p class="hint">e.g. http://localhost:3000 for dev, or your deployed instance.</p>

  <button id="save">Save</button>
  <p id="status" class="status">Saved.</p>

  <script src="options.js"></script>
</body>
</html>
